<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Lootemall -- Gamescom</title>
<meta name="theme-color" content="#05050a" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230a0b0d'/%3E%3Cpath d='M4 11c0-3 4-5 8-5s8 2 8 5' stroke='%23e8b34a' stroke-width='1.8' fill='none' stroke-linecap='round'/%3E%3Crect x='3' y='11' width='18' height='8' rx='1.5' fill='%23e8b34a'/%3E%3Crect x='9.5' y='13.5' width='5' height='3.5' rx='0.6' fill='%230a0b0d'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="auth-gate.css" />
</head>
<body>
<div id="app">

  <div id="toast-stack"></div>

  <header id="topbar">
    <div id="wordmark"><span class="dot"></span>LOOTEMALL<small>Gamescom</small></div>
    <div id="topbar-actions">
      <button class="icon-btn on" id="btn-3d-toggle" title="Toggle 3D view"></button>
      <button class="icon-btn" id="btn-track-me" title="Track my position"></button>
      <button class="icon-btn" id="btn-refresh" title="Refresh"></button>
      <button class="icon-btn" id="btn-account" title="Account"></button>
    </div>
  </header>

  <div id="searchbar" class="searchbar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search-input" class="search-input" type="text" placeholder="Search company, item, or booth..." autocomplete="off" />
    <span id="search-clear" class="search-clear">&times;</span>
    <!-- Booth/company matches from the real floor plan -- see
         searchBoothsAndCompanies's own comment on how this differs from
         the loot-based hall dimming this bar also does on the venue map
         underneath. Absolutely positioned inside .searchbar (not a
         sibling) so `top: 100%` anchors to the search bar's own box
         without a separate positioned wrapper. -->
    <div id="search-results" class="search-results-dropdown"></div>
  </div>

  <div id="views">

    <section class="view active" id="view-map">
      <div id="map-scroll">
        <div id="venue-svg-wrap">
          <svg id="venue-svg" viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
      </div>
      <div id="legend-strip"></div>
    </section>

    <section class="view" id="view-leaderboard">
      <div id="leaderboard-tabs">
        <button class="lb-tab active" data-tab="top_loot">Top Loot</button>
        <button class="lb-tab" data-tab="top_halls">Top Halls</button>
        <button class="lb-tab" data-tab="top_finders">Top Scouts</button>
        <button class="lb-tab" data-tab="giveaways">Giveaways</button>
      </div>
      <div id="leaderboard-list"></div>
    </section>

  </div>

  <nav id="bottomnav">
    <button class="nav-btn active" data-view="map">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 20l-6-3V4l6 3 6-3 6 3v13l-6-3-6 3z"/><line x1="9" y1="7" x2="9" y2="20"/><line x1="15" y1="4" x2="15" y2="17"/></svg>
      Map
    </button>
    <button class="nav-btn center" id="btn-add-global" title="Add loot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="nav-btn" data-view="leaderboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3a2 2 0 0 1-2 4h-1M7 5H4a2 2 0 0 0 2 4h1"/></svg>
      Board
    </button>
  </nav>

  <!-- Hall detail sheet: schematic interior canvas with pins -->
  <div id="hall-sheet">
    <div class="sheet-header">
      <button class="icon-btn" id="hall-sheet-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div>
        <h2 id="hall-sheet-title">Hall</h2>
        <div class="sub" id="hall-sheet-sub"></div>
      </div>
    </div>
    <div id="hall-searchbar" class="searchbar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="hall-search-input" class="search-input" type="text" placeholder="Search company or booth in this hall's plan..." autocomplete="off" />
      <span id="hall-search-clear" class="search-clear">&times;</span>
      <div id="hall-search-results" class="search-results-dropdown"></div>
    </div>
    <div id="hall-level-switcher"></div>
    <div id="hall-canvas-wrap">
      <div class="crosshair-hint" id="hall-hint">Tap the floor to drop a loot pin</div>
      <div class="accuracy-pill" id="hall-accuracy"></div>
      <div id="hall-canvas-inner">
        <!-- preserveAspectRatio="none": loot pins are positioned as plain CSS
             percentages of this container (see app.js's renderHallPins), so
             the SVG plan must stretch to exactly fill it with no letterboxing
             -- otherwise a pin's saved 0..1 fraction and the plan's own
             content wouldn't agree on where "0.5, 0.5" actually is. Trades a
             hall's true aspect ratio (may look slightly stretched/squished)
             for pixel-accurate pin placement, which matters more here. -->
        <svg id="hall-plan-svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg>
        <div id="me-dot"><div class="me-dot-ring"></div><div class="me-dot-core"></div><div class="me-dot-heading"></div></div>
      </div>
      <button class="icon-btn" id="hall-zoom-reset" title="Reset zoom">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m11-5v3a2 2 0 0 1-2 2h-3"/></svg>
      </button>
    </div>
    <div id="hall-add-fab">
      <button class="btn btn-primary" id="hall-add-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" width="16" height="16"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add loot here
      </button>
    </div>
  </div>

  <!-- Account sheet: sign-in (logged out) or profile + own activity
       (logged in). See app.js's own auth section for the flow. -->
  <div id="account-sheet">
    <div class="sheet-header">
      <button class="icon-btn" id="account-sheet-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div><h2>Account</h2></div>
    </div>
    <div class="sheet-body" id="account-sheet-body"></div>
  </div>

  <!-- Booth detail sheet: real company/booth info from the official floor
       plan, plus any loot already reported there -->
  <div id="booth-sheet">
    <div class="sheet-header">
      <button class="icon-btn" id="booth-sheet-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div>
        <h2 id="booth-sheet-title">Booth</h2>
        <div class="sub" id="booth-sheet-sub"></div>
      </div>
    </div>
    <div class="sheet-body" id="booth-sheet-body"></div>
    <div class="sheet-footer">
      <button class="btn btn-ghost" id="booth-giveaway-btn" style="flex:1">Schedule giveaway</button>
      <button class="btn btn-primary" id="booth-report-btn" style="flex:1">Report loot here</button>
    </div>
  </div>

  <!-- Schedule-a-giveaway sheet: booth programming with a real date/time,
       not a "found here" report. Company field resolves against the
       searchable index built in app.js (official floor plan + hand-
       maintained extras + everything already reported through the app) so
       most of the time no map tap is needed at all. -->
  <div id="giveaway-sheet">
    <div class="sheet-header">
      <button class="icon-btn" id="giveaway-sheet-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div><h2>Schedule a giveaway</h2></div>
    </div>
    <div class="sheet-body">
      <div class="field">
        <label>Company</label>
        <input type="text" id="giveaway-form-company" list="giveaway-company-list" placeholder="e.g. Lexar Europe B.V." maxlength="120" />
        <datalist id="giveaway-company-list"></datalist>
      </div>
      <div class="field">
        <label>Hall</label>
        <input type="text" id="giveaway-form-hall" readonly placeholder="Pick a matching company above, or tap a booth on the map" />
      </div>
      <div class="field">
        <label>Booth number</label>
        <input type="text" id="giveaway-form-booth" placeholder="e.g. B-071" maxlength="40" />
      </div>
      <button class="btn btn-ghost" id="giveaway-pick-on-map" style="width:100%">Pick booth on map instead</button>
      <div class="field">
        <label>Prize</label>
        <input type="text" id="giveaway-form-prize" placeholder="e.g. PS5 lucky draw" maxlength="200" />
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="giveaway-form-date" />
      </div>
      <div class="field">
        <label>Time</label>
        <input type="time" id="giveaway-form-time" />
      </div>
      <div class="field">
        <label>Notes (optional)</label>
        <textarea id="giveaway-form-notes" placeholder="e.g. Must be present, one entry per person" maxlength="500"></textarea>
      </div>
      <div class="field-hint" id="giveaway-form-hint">Type a company already on the map to auto-fill its booth.</div>
    </div>
    <div class="sheet-footer">
      <button class="btn btn-ghost" id="giveaway-cancel" style="flex:1">Cancel</button>
      <button class="btn btn-primary" id="giveaway-submit" style="flex:2">Schedule giveaway</button>
    </div>
  </div>

  <!-- Loot detail bottom sheet -->
  <div id="loot-sheet">
    <div class="sheet-header">
      <button class="icon-btn" id="loot-sheet-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div><h2>Loot details</h2></div>
    </div>
    <div class="sheet-body" id="loot-sheet-body"></div>
  </div>

  <!-- Add loot form sheet -->
  <!-- Report loot sheet -- items/photo come first and are tap-first (chips,
       a big camera button), not type-first: direct feedback that filling
       this in "isn't easy" and needed to be a "super quick UI." Hall/
       booth/company stay further down since a tap-to-open booth already
       fills them in most of the time (see openAddSheet's own prefill) --
       they need attention far less often than "what did you find." -->
  <div id="add-sheet">
    <div class="sheet-header">
      <button class="icon-btn" id="add-sheet-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div><h2>Report loot</h2></div>
    </div>
    <div class="sheet-body">
      <div class="field">
        <label>What did you find? Tap any that apply</label>
        <div class="item-chip-row" id="item-chip-row"></div>
        <textarea id="form-items" placeholder="e.g. pins, poster, keycap, tote bag" maxlength="500"></textarea>
      </div>
      <div class="field">
        <label>Photo (optional)</label>
        <label class="photo-picker" id="photo-picker" for="form-photo">
          <span id="photo-picker-icon"></span>
          <span id="photo-picker-text">Take or add a photo</span>
          <input type="file" accept="image/*" capture="environment" id="form-photo" />
        </label>
      </div>
      <div class="field">
        <label>Hall</label>
        <input type="text" id="form-hall-display" readonly />
      </div>
      <div class="field">
        <label>Booth number</label>
        <input type="text" id="form-booth" placeholder="e.g. B021" maxlength="40" />
      </div>
      <div class="field">
        <label>Company name</label>
        <input type="text" id="form-company" placeholder="e.g. Nova Interactive" maxlength="120" />
      </div>
      <div class="field">
        <label>Your name (optional)</label>
        <input type="text" id="form-name" placeholder="Shown on the leaderboard" maxlength="60" />
      </div>
      <div class="field-hint" id="form-pin-hint">Pin placed at the spot you tapped on the hall map.</div>
    </div>
    <div class="sheet-footer">
      <button class="btn btn-ghost" id="add-cancel" style="flex:1">Cancel</button>
      <button class="btn btn-primary" id="add-submit" style="flex:2">Submit loot</button>
    </div>
  </div>

</div>
<script src="icons.js"></script>
<script src="halls.js"></script>
<script src="extra-companies.js"></script>
<script src="auth-gate.js"></script>
<script src="app.js"></script>
</body>
</html>
