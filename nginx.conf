server {
    listen 8080;

    absolute_redirect off;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /ready {
        proxy_pass http://127.0.0.1:8643/ready;
        proxy_set_header Host $host;
    }

    location /version {
        proxy_pass http://127.0.0.1:8643/version;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8643/openapi.json;
        proxy_set_header Host $host;
    }

    # Backend API, prefix stripped: /api/loot -> /loot.
    location /api/ {
        proxy_pass http://127.0.0.1:8643/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 2M;
        # /api/events is a long-lived SSE stream -- buffering off so events
        # actually flush to the client as they're produced instead of
        # sitting in nginx's buffer until it fills.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Multi-event platform layout (see backend/events_registry.py and
    # frontend/portal/'s own comments for the full design): the portal at
    # the site root links to each event's own self-contained directory
    # under frontend/events/<id>/. A visitor hitting the bare path with no
    # trailing slash (/gamescom2026) needs the redirect below -- without
    # it that request falls through to location / (the portal) instead of
    # matching the prefix location, and the event app's own relative
    # asset paths (styles.css, app.js, ...) would then resolve against the
    # WRONG base URL.
    location = /gamescom2026 {
        return 301 /gamescom2026/;
    }
    location /gamescom2026/ {
        alias /opt/loot-radar/frontend/events/gamescom2026/;
        try_files $uri $uri/ /gamescom2026/index.html;
        add_header Cache-Control "no-cache";
    }

    # Portal -- no-cache (not no-store) so an unchanged file is still a
    # fast 304 via nginx's own ETag/Last-Modified, but a changed one is
    # picked up immediately without a manual hard-refresh. Matters more
    # than usual here: this app gets iterated on live, mid-event.
    location / {
        root /opt/loot-radar/frontend/portal;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
